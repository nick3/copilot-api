name: CI

on:
  push:
    branches: [ "main", "dev", "all", "release" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install admin-ui dependencies
        run: bun install --frozen-lockfile --cwd admin-ui

      - name: Run linter
        run: bun run lint:all

      - name: Run admin-ui linter
        run: bun run lint:admin

      - name: Run type check
        run: bun run typecheck

      - name: Run admin-ui type check
        run: bun run typecheck:admin

      - name: Run tests
        run: bun test --isolate

      - name: Run admin-ui tests
        run: cd admin-ui && bun test --isolate

      - name: Build
        run: bun run build
